<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="diceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e8fc"/>
      <stop offset="50%" stop-color="#d4ccfc"/>
      <stop offset="100%" stop-color="#e9d8fd"/>
    </linearGradient>

    <!-- Shadow for Die 1 -->
    <filter id="shadowDie1" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="16" stdDeviation="16" flood-color="#483285" flood-opacity="0.22"/>
    </filter>

    <!-- Shadow for Die 2 -->
    <filter id="shadowDie2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="20" stdDeviation="18" flood-color="#483285" flood-opacity="0.28"/>
    </filter>

    <linearGradient id="dieFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f2ff"/>
    </linearGradient>

    <linearGradient id="dieFace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eee8fc"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="40" fill="url(#diceBg)"/>

  <!-- Subtle playful background sparkles -->
  <circle cx="90" cy="110" r="14" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="120" r="18" fill="#ffffff" opacity="0.6"/>
  <circle cx="410" cy="420" r="12" fill="#ffffff" opacity="0.5"/>
  <circle cx="100" cy="410" r="16" fill="#ffffff" opacity="0.5"/>

  <!-- Left Die (showing 3 dots) - Rotated -12 deg -->
  <g transform="translate(68, 160) rotate(-12)" filter="url(#shadowDie1)">
    <!-- 3D Bevel Edge -->
    <rect x="0" y="8" width="190" height="190" rx="34" fill="#5439aa"/>
    <!-- Die Body -->
    <rect x="0" y="0" width="190" height="190" rx="34" fill="url(#dieFace1)" stroke="#7454d6" stroke-width="7"/>

    <!-- 3 Purple Dots -->
    <!-- Top-Left Pip -->
    <circle cx="52" cy="52" r="16" fill="#7454d6"/>
    <!-- Center Pip -->
    <circle cx="95" cy="95" r="16" fill="#7454d6"/>
    <!-- Bottom-Right Pip -->
    <circle cx="138" cy="138" r="16" fill="#7454d6"/>
  </g>

  <!-- Right Die (showing 5 dots) - Rotated 14 deg, slightly overlapping -->
  <g transform="translate(254, 150) rotate(14)" filter="url(#shadowDie2)">
    <!-- 3D Bevel Edge -->
    <rect x="0" y="8" width="190" height="190" rx="34" fill="#5439aa"/>
    <!-- Die Body -->
    <rect x="0" y="0" width="190" height="190" rx="34" fill="url(#dieFace2)" stroke="#7454d6" stroke-width="7"/>

    <!-- 5 Purple Dots -->
    <!-- Top-Left Pip -->
    <circle cx="52" cy="52" r="16" fill="#7454d6"/>
    <!-- Top-Right Pip -->
    <circle cx="138" cy="52" r="16" fill="#7454d6"/>
    <!-- Center Pip -->
    <circle cx="95" cy="95" r="16" fill="#7454d6"/>
    <!-- Bottom-Left Pip -->
    <circle cx="52" cy="138" r="16" fill="#7454d6"/>
    <!-- Bottom-Right Pip -->
    <circle cx="138" cy="138" r="16" fill="#7454d6"/>
  </g>
</svg>
