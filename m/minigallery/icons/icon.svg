<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 2x2 App Grid -->
  <g filter="url(#shadow)">
    <!-- Tile 1 -->
    <rect x="96" y="96" width="140" height="140" rx="30" fill="url(#tile1)"/>
    <!-- Tile 2 -->
    <rect x="276" y="96" width="140" height="140" rx="30" fill="url(#tile2)"/>
    <!-- Tile 3 -->
    <rect x="96" y="276" width="140" height="140" rx="30" fill="url(#tile3)"/>
    <!-- Tile 4 -->
    <rect x="276" y="276" width="140" height="140" rx="30" fill="url(#tile4)"/>
  </g>

  <!-- Tile Icons -->
  <!-- Tile 1: Play / Waves -->
  <path d="M 152 140 L 186 166 L 152 192 Z" fill="#ffffff"/>
  
  <!-- Tile 2: Bird / Wing -->
  <path d="M 320 180 Q 346 150 372 165 Q 354 175 346 186 Q 338 175 320 180 Z" fill="#ffffff"/>
  
  <!-- Tile 3: Star -->
  <polygon points="166,312 173,330 193,331 177,343 183,362 166,350 149,362 155,343 139,331 159,330" fill="#ffffff"/>
  
  <!-- Tile 4: Die dots -->
  <circle cx="320" cy="320" r="10" fill="#ffffff"/>
  <circle cx="346" cy="346" r="10" fill="#ffffff"/>
  <circle cx="372" cy="372" r="10" fill="#ffffff"/>
</svg>
